日曜の朝、末っ子の自転車の練習に付き合った。補助輪を外して三週目。サドルを支える手に、まだ全体重がかかっている。

「離さないでね」と言われて、「離さないよ」と答えながら、少しずつ手を緩めるのが親の仕事だ。ふいに手応えが消えて、娘が一人で五メートル進んだ。本人はまだ気づいていない。後ろで僕だけが、声を出さずに拍手をしていた。

> 子育ては、手を離すことの練習を、親がする時間なのかもしれない。

上の子たちのときは、僕は今より忙しくて、こういう朝をいくつも逃した気がする。だから今は、なるべく現場にいたい。人生の後半戦で増やしたいのは、資産よりもこういう日曜日だ。
