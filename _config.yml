# ご機嫌に暮らす、人生の後半戦。 — サイト基本設定
title: ご機嫌に暮らす、人生の後半戦。
description: 投資、家族、健康、キャリア、趣味と仲間。人生の後半を、機嫌よく丁寧に生きるための記録。
url: "https://pinappe0305.github.io"
baseurl: ""
lang: ja
timezone: Asia/Tokyo
author: あらい りょうた

permalink: /:year/:month/:slug/
future: false
markdown: kramdown

exclude:
  - README.md

# 記事の既定値（CMSからlayout指定不要・未指定なら非公開）
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      published: false

